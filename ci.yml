name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Full Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Baseline Model & Track to MLflow
        run: |
          python train.py --algorithm rf --n_estimators 100 --max_depth 6

      - name: Run Automated Pytest Suite
        run: |
          pytest -v --tb=short

      - name: Run Data Drift Check
        run: |
          python drift_check.py --simulate

  docker-build:
    needs: test-and-train
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Train Artifact For Container
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python train.py --algorithm rf --n_estimators 100 --max_depth 6

      - name: Build Serving Docker Image
        run: |
          docker build -t cybersecurity-threat-predictor:latest .
          docker images cybersecurity-threat-predictor:latest
